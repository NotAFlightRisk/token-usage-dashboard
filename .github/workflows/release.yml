name: 📦 Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: 📦 Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Match the version to the tag
        env:
          TAG: ${{ inputs.tag }}
        run: npm version "$TAG" --no-git-tag-version --allow-same-version
      - name: Pack the server
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tar -czf "token-usage-dashboard-$TAG.tar.gz" build bin package.json package-lock.json .env.example
          echo "Run it with: npm ci --omit=dev && npm start" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" "token-usage-dashboard-$TAG.tar.gz" \
            --title "$TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
