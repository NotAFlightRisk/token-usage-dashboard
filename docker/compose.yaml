services:
  token-usage-dashboard:
    image: notaflightrisk/token-usage-dashboard:latest
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ${HOME}/.claude:/home/node/.claude:ro
      - ${HOME}/.codex:/home/node/.codex:ro
      - token-usage:/data
    restart: unless-stopped

volumes:
  token-usage:
